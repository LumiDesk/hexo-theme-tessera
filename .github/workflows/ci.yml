name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The theme smoke checks do not need dependency lifecycle scripts.
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm test

  hexo-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate a minimal Hexo fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/tessera-hexo-fixture"
          mkdir -p "$fixture/source/_posts" "$fixture/themes"
          printf '%s\n' '{"name":"tessera-ci-fixture","private":true,"dependencies":{"hexo":"^7.3.0","hexo-generator-index":"^3.0.0","hexo-renderer-marked":"^6.3.0","hexo-renderer-pug":"^3.0.0","hexo-renderer-stylus":"^3.0.1"}}' > "$fixture/package.json"
          printf '%s\n' 'title: Tessera CI fixture' 'theme: tessera' 'permalink: :year/:month/:day/:title/' > "$fixture/_config.yml"
          printf '%s\n' '---' 'title: Tessera fixture' '---' '' 'Generated by CI.' > "$fixture/source/_posts/fixture.md"
          ln -s "$GITHUB_WORKSPACE" "$fixture/themes/tessera"
          # Avoid pnpm's interactive build-script approval in the fixture.
          pnpm --dir "$fixture" install --no-frozen-lockfile --ignore-scripts
          (cd "$fixture" && node -e "const Hexo=require('hexo'); const hexo=new Hexo(process.cwd(),{}); hexo.init().then(()=>hexo.call('generate')).then(()=>process.exit(0)).catch(error=>{console.error(error); process.exit(1)})")
          test -f "$fixture/public/index.html"
