name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test

  hexo-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Generate a minimal Hexo fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/tessera-hexo-fixture"
          mkdir -p "$fixture/source" "$fixture/themes"
          printf '%s\n' '{"name":"tessera-ci-fixture","private":true,"dependencies":{"hexo":"^7.3.0","hexo-renderer-pug":"^3.0.0","hexo-renderer-stylus":"^3.0.1"}}' > "$fixture/package.json"
          printf '%s\n' 'title: Tessera CI fixture' 'theme: tessera' 'permalink: :year/:month/:day/:title/' > "$fixture/_config.yml"
          printf '%s\n' '# Tessera fixture' '' 'Generated by CI.' > "$fixture/source/index.md"
          ln -s "$GITHUB_WORKSPACE" "$fixture/themes/tessera"
          pnpm --dir "$fixture" install --no-frozen-lockfile
          pnpm --dir "$fixture" exec hexo generate
          test -f "$fixture/public/index.html"
