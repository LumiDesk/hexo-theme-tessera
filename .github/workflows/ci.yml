name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The theme smoke checks do not need dependency lifecycle scripts.
      - run: pnpm install --no-frozen-lockfile --ignore-scripts
      - run: pnpm test

